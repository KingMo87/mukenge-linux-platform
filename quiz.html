<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSHELL // Linux Trivia</title>

<style>
  :root{
    --bg:#07090a;
    --panel: rgba(255,255,255,0.035);
    --panel-solid:#0d1210;
    --line: rgba(255,255,255,0.09);
    --line-soft: rgba(255,255,255,0.06);
    --mint:#3fe8a5;
    --mint-dim:#1f8a63;
    --mint-glow: rgba(63,232,165,.35);
    --coral:#ff7a72;
    --coral-glow: rgba(255,122,114,.28);
    --ink:#eef7f2;
    --muted:#93a89e;
    --muted-2:#5d7268;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(1100px 600px at 50% -8%, rgba(63,232,165,.10), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(63,232,165,.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(700px 500px at 50% 20%, black, transparent);
    pointer-events:none;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:600px;
  }
  .glow{
    position:absolute;
    inset:-40px;
    background: radial-gradient(circle at 50% 0%, var(--mint-glow), transparent 60%);
    filter: blur(50px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
  }
  .card{
    position:relative;
    z-index:1;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:20px;
    backdrop-filter: blur(20px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 30px 80px rgba(0,0,0,.55);
    overflow:hidden;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px;
    border-bottom:1px solid var(--line-soft);
  }
  .topbar .id{
    display:flex; align-items:center; gap:9px;
    font-family:var(--mono); font-size:12px; color:var(--muted);
  }
  .pulse{
    width:7px; height:7px; border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 0 0 var(--mint-glow);
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,232,165,.5);}
    70%{box-shadow:0 0 0 8px rgba(63,232,165,0);}
    100%{box-shadow:0 0 0 0 rgba(63,232,165,0);}
  }
  .topbar .ver{font-family:var(--mono); font-size:11px; color:var(--muted-2);}

  .body{ padding:28px 26px 24px; }

  /* ---------- NAME GATE ---------- */
  .namewrap h1{ font-size:24px; font-weight:700; letter-spacing:-.01em; margin:0 0 8px; }
  .namewrap p{ margin:0 0 20px; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:44ch; }
  .nameinput{
    width:100%; background: rgba(255,255,255,.04); border:1px solid var(--line);
    color:var(--ink); font-family:var(--sans); font-size:15px; font-weight:600;
    padding:14px 16px; border-radius:12px; outline:none;
    transition: border-color .15s ease;
  }
  .nameinput:focus{ border-color: var(--mint-dim); }
  .nameinput::placeholder{ color:var(--muted-2); font-weight:400; }
  .namebtn{
    margin-top:12px; width:100%; background: var(--mint); border:none; color:#04120b;
    font-family:var(--sans); font-weight:700; font-size:14.5px;
    padding:14px 16px; border-radius:12px; cursor:pointer;
    box-shadow: 0 6px 20px rgba(63,232,165,.22);
  }
  .namebtn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .namebtn:not(:disabled):hover{ filter: brightness(1.05); }

  /* ---------- OPERATOR BAR ---------- */
  .operatorbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line-soft);
  }
  .operatorbar .who{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:34px; height:34px; border-radius:10px; flex:none;
    background: linear-gradient(160deg, var(--mint), var(--mint-dim));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; color:#04120b;
  }
  .operatorbar .name{ font-size:13.5px; font-weight:700; line-height:1.2; }
  .operatorbar .rank{ font-size:11.5px; color:var(--muted); line-height:1.2; margin-top:1px; }
  .operatorbar .linkbtn{
    background:none; border:none; color:var(--muted); font-family:var(--sans);
    font-size:12px; cursor:pointer; padding:6px 10px; border-radius:8px;
    display:flex; align-items:center; gap:5px;
  }
  .operatorbar .linkbtn:hover{ color:var(--ink); background: rgba(255,255,255,.05); }

  /* ---------- BADGES / HALL OF FAME ---------- */
  .badgegrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px; }
  .badgecell{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
  .hex{
    width:60px; height:60px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .hex .chev{ color:#04120b; font-size:13px; line-height:1; font-weight:800; margin-top:-3px; }
  .hex.locked{ background: rgba(255,255,255,.05); }
  .hex.locked .chev{ color: var(--muted-2); }
  .badgecell .bname{ font-size:11px; font-weight:600; color:var(--ink); }
  .badgecell .bname.dim{ color:var(--muted-2); font-weight:500; }
  .badgecell .bprog{ font-size:10px; color:var(--muted-2); font-family:var(--mono); }

  .statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; margin-bottom:8px; }
  .statbox{
    background: rgba(255,255,255,.03); border:1px solid var(--line-soft);
    border-radius:12px; padding:13px 14px;
  }
  .statbox .sval{ font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .statbox .slbl{ font-size:11px; color:var(--muted); margin-top:2px; }

  .sectionlbl{ font-size:12px; color:var(--muted-2); margin:22px 0 4px; font-weight:600; }

  .bestgrid{ display:grid; gap:8px; margin-top:10px; }
  .bestrow{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(255,255,255,.02); border:1px solid var(--line-soft);
    border-radius:10px; padding:10px 14px; font-size:13px;
  }
  .bestrow .blen{ color:var(--muted); }
  .bestrow .bscore{ font-family:var(--mono); color:var(--mint); font-weight:700; }
  .bestrow .bscore.none{ color:var(--muted-2); font-weight:400; }

  /* ---------- BADGE UNLOCK PANEL ---------- */
  .unlockpanel{
    display:flex; align-items:center; gap:14px;
    background: linear-gradient(180deg, rgba(63,232,165,.1), rgba(63,232,165,.03));
    border:1px solid rgba(63,232,165,.3);
    border-radius:14px; padding:14px 16px; margin-bottom:20px;
    animation: rise .35s cubic-bezier(.2,.8,.2,1);
  }
  .unlockpanel .hex{ width:48px; height:48px; flex:none; }
  .unlockpanel .hex .chev{ font-size:11px; }
  .unlockpanel .utext .utitle{ font-size:12px; color:var(--mint); font-weight:700; }
  .unlockpanel .utext .uname{ font-size:14.5px; font-weight:700; margin-top:1px; }
  .unlockpanel .ucta{
    margin-left:auto; flex:none; background:#04120b; color:var(--mint);
    border:1px solid rgba(63,232,165,.4); font-family:var(--sans); font-weight:700;
    font-size:12px; padding:9px 13px; border-radius:9px; cursor:pointer; text-decoration:none;
    white-space:nowrap;
  }
  .unlockpanel .ucta:hover{ background: rgba(63,232,165,.12); }

  /* ---------- WEAK-SPOT CTA ---------- */
  .ctacard{
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:20px 0;
  }
  .ctacard .ceyebrow{ font-size:11px; color:var(--mint); font-weight:700; margin-bottom:5px; }
  .ctacard .ctitle{ font-size:14.5px; font-weight:700; margin-bottom:4px; }
  .ctacard .csub{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:12px; }
  .ctacard .cbtn{
    display:inline-block; background: var(--mint); color:#04120b; text-decoration:none;
    font-family:var(--sans); font-weight:700; font-size:13px; padding:10px 16px; border-radius:10px;
  }
  .ctacard .cbtn:hover{ filter: brightness(1.05); }

  /* ---------- START SCREEN ---------- */
  .hero h1{
    font-size:26px; font-weight:700; letter-spacing:-0.01em; margin:0 0 8px;
    line-height:1.2;
  }
  .hero h1 .accent{ color:var(--mint); }
  .hero p{ margin:0; color:var(--muted); font-size:14.5px; line-height:1.6; max-width:46ch; }

  .lengths{ margin-top:26px; display:grid; gap:10px; }
  .lenbtn{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(255,255,255,.03);
    border:1px solid var(--line);
    color:var(--ink);
    padding:15px 18px;
    border-radius:14px;
    cursor:pointer;
    font-family:var(--sans);
    text-align:left;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .lenbtn:hover{
    border-color: var(--mint-dim);
    background: rgba(63,232,165,.06);
    transform: translateY(-1px);
  }
  .lenbtn .lname{ font-size:14.5px; font-weight:600; }
  .lenbtn .lsub{ display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px; }
  .lenbtn .lcount{
    font-family:var(--mono); font-size:12px; color:var(--mint);
    background: rgba(63,232,165,.1); padding:5px 10px; border-radius:999px; flex:none;
  }

  .topics{ margin-top:24px; }
  .topics .lbl{ font-size:12px; color:var(--muted-2); margin-bottom:10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:12px; color:var(--muted); padding:6px 11px;
    border:1px solid var(--line-soft); border-radius:999px;
    background: rgba(255,255,255,.02);
  }

  /* ---------- QUIZ SCREEN ---------- */
  .progresswrap{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .progresstrack{
    flex:1; height:6px; border-radius:999px; background: rgba(255,255,255,.06); overflow:hidden;
  }
  .progressfill{
    height:100%; border-radius:999px;
    background: linear-gradient(90deg, var(--mint-dim), var(--mint));
    width:0%; transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .progresstxt{ font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .scoretxt{ font-family:var(--mono); font-size:11.5px; color:var(--mint); white-space:nowrap; }

  .qframe{ animation: rise .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .catpill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--mint); font-family:var(--mono);
    border:1px solid rgba(63,232,165,.25); background: rgba(63,232,165,.07);
    padding:4px 10px; border-radius:999px; margin-bottom:16px;
  }
  .qtext{
    font-size:18px; font-weight:600; line-height:1.45; letter-spacing:-.005em;
    margin-bottom:20px; color:var(--ink);
  }

  .options{ display:grid; gap:9px; }
  .opt{
    display:flex; align-items:center; gap:12px;
    background: rgba(255,255,255,.025);
    border:1px solid var(--line);
    color:var(--ink);
    padding:14px 15px;
    border-radius:13px;
    cursor:pointer;
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.4;
    text-align:left;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover:not(.locked){
    border-color: rgba(63,232,165,.35);
    background: rgba(63,232,165,.05);
  }
  .opt:active:not(.locked){ transform: scale(.995); }
  .opt .key{
    flex:none; width:22px; height:22px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11.5px; color:var(--muted);
    background: rgba(255,255,255,.05); border:1px solid var(--line-soft);
  }
  .opt.locked{ cursor:default; }
  .opt.correct{
    border-color: var(--mint); background: rgba(63,232,165,.1);
    box-shadow: 0 0 0 1px rgba(63,232,165,.15), 0 8px 24px rgba(63,232,165,.08);
  }
  .opt.correct .key{ background: var(--mint); color:#04120b; border-color: transparent; }
  .opt.wrong{
    border-color: var(--coral); background: rgba(255,122,114,.08);
  }
  .opt.wrong .key{ background: var(--coral); color:#2a0d0b; border-color: transparent; }

  .feedback{
    margin-top:16px; font-size:13.5px; min-height:20px;
    display:flex; align-items:center; gap:8px;
  }
  .feedback.ok{ color: var(--mint); }
  .feedback.bad{ color: var(--coral); }

  .footerbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px; padding-top:18px; border-top:1px solid var(--line-soft);
  }
  .hint{ font-size:11.5px; color:var(--muted-2); font-family:var(--mono); }
  .nextbtn{
    background: var(--mint); border:none; color:#04120b;
    font-family:var(--sans); font-weight:700; font-size:13.5px;
    padding:11px 20px; border-radius:11px; cursor:pointer;
    opacity:0; transform: translateY(4px); pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 6px 20px rgba(63,232,165,.25);
  }
  .nextbtn.active{ opacity:1; transform: translateY(0); pointer-events:auto; }
  .nextbtn:hover{ filter: brightness(1.06); }

  /* ---------- RESULTS SCREEN ---------- */
  .resulttop{ display:flex; align-items:center; gap:22px; margin-bottom:24px; }
  .ring{
    flex:none; width:104px; height:104px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--mint) calc(var(--pct) * 1%), rgba(255,255,255,.07) 0);
    position:relative;
  }
  .ring::before{
    content:""; position:absolute; inset:8px; border-radius:50%;
    background: var(--panel-solid);
  }
  .ring .val{ position:relative; font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .resulttop .rtext h2{ margin:0 0 4px; font-size:20px; font-weight:700; }
  .resulttop .rtext p{ margin:0; font-size:13.5px; color:var(--muted); }

  .breakdown{ display:grid; gap:10px; margin-bottom:22px; }
  .brow{ display:flex; align-items:center; gap:12px; }
  .brow .blabel{ width:180px; flex:none; font-size:12.5px; color:var(--muted); }
  .brow .btrack{ flex:1; height:6px; border-radius:999px; background: rgba(255,255,255,.06); overflow:hidden; }
  .brow .bfill{ height:100%; border-radius:999px; background: var(--mint); }
  .brow .bval{ width:42px; flex:none; text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--muted); }

  .missed h3{ font-size:12.5px; color:var(--muted-2); font-weight:600; margin:0 0 12px; }
  .mitem{
    border-left:2px solid var(--coral);
    background: rgba(255,255,255,.02);
    border-radius:0 10px 10px 0;
    padding:10px 14px; margin-bottom:8px;
  }
  .mitem .mq{ font-size:13.5px; color:var(--ink); margin-bottom:5px; font-weight:500; }
  .mitem .ma{ font-size:12px; color:var(--muted); }
  .mitem .ma b{ color:var(--mint); font-weight:600; }
  .clean{ font-size:13.5px; color:var(--muted); }

  .actions{ display:flex; gap:10px; margin-top:24px; }
  .abtn{
    flex:1; padding:13px 16px; border-radius:12px; cursor:pointer;
    font-family:var(--sans); font-size:13.5px; font-weight:600;
    border:1px solid var(--line); background: rgba(255,255,255,.03); color:var(--ink);
    transition: background .15s ease, border-color .15s ease;
  }
  .abtn:hover{ background: rgba(255,255,255,.06); }
  .abtn.primary{
    background: var(--mint); color:#04120b; border-color: transparent;
    box-shadow: 0 6px 20px rgba(63,232,165,.22);
  }
  .abtn.primary:hover{ filter: brightness(1.05); }

  @media (max-width:480px){
    .body{ padding:22px 18px; }
    .hero h1{ font-size:22px; }
    .qtext{ font-size:16.5px; }
    .brow .blabel{ width:120px; font-size:11.5px; }
    .resulttop{ gap:16px; }
    .ring{ width:84px; height:84px; }
    .ring .val{ font-size:18px; }
    .badgegrid{ gap:6px; }
    .hex{ width:48px; height:48px; }
    .statgrid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="card">
    <div class="topbar">
      <div class="id"><span class="pulse"></span> moshell / linux-quiz</div>
      <div class="ver">v2.0</div>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>

function defaultProfile(nickname){
  return {
    nickname: nickname,
    totalAnswered: 0,
    totalCorrect: 0,
    bestByLength: {},
    badges: [],
    createdAt: Date.now()
  };
}

function loadProfile(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(err){
    console.warn('moshell-quiz: could not read local storage', err);
    return null;
  }
}

function saveProfile(profile){
  try{
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  }catch(err){
    console.warn('moshell-quiz: could not save to local storage', err);
  }
}

function currentRank(profile){
  let rank = null;
  BADGES.forEach(b => { if(profile.totalAnswered >= b.threshold) rank = b; });
  return rank;
}

function nextBadge(profile){
  return BADGES.find(b => profile.totalAnswered < b.threshold) || null;
}

function badgeHex(badge, locked){
  const bg = locked ? 'rgba(255,255,255,.05)' : `linear-gradient(160deg, ${badge.c1}, ${badge.c2})`;
  const chevs = Array.from({length:badge.level}).map(()=>'&#94;').join('');
  return `<div class="hex${locked?' locked':''}" style="background:${bg}">
    <span class="chev">${locked ? '' : chevs}</span>
  </div>`;
}

function initials(name){
  return (name||'?').trim().slice(0,2).toUpperCase();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function categoryCounts(){
  const cats = {};
  QUESTIONS.forEach(q => cats[q.cat] = (cats[q.cat]||0)+1);
  return cats;
}

function renderNameGate(){
  body.innerHTML = `
    <div class="namewrap">
      <h1>Who's logging in?</h1>
      <p>Pick a nickname to track your scores and unlock rank badges as you answer more questions. Saved only on this device.</p>
      <input class="nameinput" id="nameInput" maxlength="18" placeholder="Nickname" autocomplete="off" />
      <button class="namebtn" id="nameBtn" disabled>Start</button>
    </div>
  `;
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('nameBtn');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length === 0; });
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !btn.disabled) btn.click(); });
  btn.addEventListener('click', ()=>{
    const nickname = input.value.trim().slice(0,18);
    if(!nickname) return;
    const profile = defaultProfile(nickname);
    saveProfile(profile);
    renderStart();
  });
  setTimeout(()=> input.focus(), 50);
}

      <button class="lenbtn" data-len="10"><span><span class="lname">Quick run</span><span class="lsub">A fast warm-up</span></span><span class="lcount">10</span></button>
      <button class="lenbtn" data-len="25"><span><span class="lname">Standard run</span><span class="lsub">A solid check-in</span></span><span class="lcount">25</span></button>
      <button class="lenbtn" data-len="50"><span><span class="lname">Long run</span><span class="lsub">Cover most topics</span></span><span class="lcount">50</span></button>
      <button class="lenbtn" data-len="100"><span><span class="lname">Full deck</span><span class="lsub">Every question, shuffled</span></span><span class="lcount">100</span></button>
    </div>
    <div class="topics">
      <div class="lbl">Topics covered</div>
      <div class="chips">${chips}</div>
    </div>
  `;
  body.querySelectorAll('.lenbtn').forEach(btn=>{
    btn.addEventListener('click', ()=> startQuiz(parseInt(btn.dataset.len,10)));
  });
  document.getElementById('profileBtn').addEventListener('click', renderProfile);
  document.getElementById('switchBtn').addEventListener('click', renderNameGate);
}

function renderProfile(){
  const profile = loadProfile();
  if(!profile){ renderNameGate(); return; }

  const rank = currentRank(profile);
  const upcoming = nextBadge(profile);
  const accuracy = profile.totalAnswered ? Math.round((profile.totalCorrect/profile.totalAnswered)*100) : 0;

  const badgeCells = BADGES.map(b=>{
    const unlocked = profile.totalAnswered >= b.threshold;
    return `<div class="badgecell">
      ${badgeHex(b, !unlocked)}
      <span class="bname${unlocked?'':' dim'}">${b.name}</span>
      <span class="bprog">${unlocked ? 'unlocked' : Math.min(profile.totalAnswered,b.threshold)+'/'+b.threshold}</span>
    </div>`;
  }).join('');

  const lens = [10,25,50,100];
  const bestRows = lens.map(len=>{
    const best = profile.bestByLength[len];
    return `<div class="bestrow">
      <span class="blen">${len}-question run</span>
      <span class="bscore${best===undefined?' none':''}">${best===undefined ? 'not played' : best.score+'/'+len}</span>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="operatorbar">
      <div class="who">
        <div class="avatar">${initials(profile.nickname)}</div>
        <div>
          <div class="name">${profile.nickname}</div>
          <div class="rank">${rank ? rank.name : 'Unranked'}${upcoming ? ' &middot; next: '+upcoming.name : ''}</div>
        </div>
      </div>
      <button class="linkbtn" id="backBtn">Back</button>
    </div>
    <div class="statgrid">
      <div class="statbox"><div class="sval">${profile.totalAnswered}</div><div class="slbl">answered</div></div>
      <div class="statbox"><div class="sval">${profile.totalCorrect}</div><div class="slbl">correct</div></div>
      <div class="statbox"><div class="sval">${accuracy}%</div><div class="slbl">accuracy</div></div>
    </div>
    <div class="sectionlbl">Rank badges</div>
    <div class="badgegrid">${badgeCells}</div>
    <div class="sectionlbl">Best scores</div>
    <div class="bestgrid">${bestRows}</div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderStart);
}

function startQuiz(n){
  track('quiz_started', { run_length: n });
  state = {
    pool: shuffle(QUESTIONS).slice(0, n),
    idx: 0,
    score: 0,
    answered: false,
    log: []
  };
  renderQuestion();
}

function renderQuestion(){
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);

  body.innerHTML = `
    <div class="progresswrap">
      <div class="progresstrack"><div class="progressfill" style="width:${pct}%"></div></div>
      <div class="progresstxt">${state.idx+1}/${total}</div>
      <div class="scoretxt">★ ${state.score}</div>
    </div>
    <div class="qframe">
      <div class="catpill">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="footerbar">
      <span class="hint">1–4 to answer &middot; enter for next</span>
      <button class="nextbtn" id="nextBtn">Next question</button>
    </div>
  `;

  const optWrap = document.getElementById('options');
  q.options.forEach((optText, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="key">${i+1}</span><span>${optText}</span>`;
    b.addEventListener('click', ()=> selectAnswer(i));
    optWrap.appendChild(b);
  });

  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  state.answered = false;
}

function selectAnswer(i){
  if(state.answered) return;
  state.answered = true;
  const q = state.pool[state.idx];
  const opts = document.querySelectorAll('#options .opt');
  const isRight = i === q.correct;

  opts.forEach((el, idx)=>{
    el.classList.add('locked');
    if(idx === q.correct) el.classList.add('correct');
    if(idx === i && !isRight) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if(isRight){
    state.score++;
    fb.className = 'feedback ok';
    fb.textContent = 'Correct.';
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite — correct answer: ${q.options[q.correct]}`;
  }

  state.log.push({
    cat: q.cat, qtext: q.q,
    chosen: q.options[i], correctText: q.options[q.correct],
    wasRight: isRight
  });

  document.getElementById('nextBtn').classList.add('active');
}

function nextQuestion(){
  if(!state.answered) return;
  if(state.idx < state.pool.length - 1){
    state.idx++;
    renderQuestion();
  } else {
    renderResults();
  }
}

function updateProfileAfterQuiz(total, score){
  const profile = loadProfile();
  if(!profile) return { profile:null, newBadges:[] };

  const before = profile.totalAnswered;
  profile.totalAnswered += total;
  profile.totalCorrect += score;
  const existing = profile.bestByLength[total];
  if(!existing || score > existing.score){
    profile.bestByLength[total] = { score, at: Date.now() };
  }

  const newBadges = BADGES.filter(b => before < b.threshold && profile.totalAnswered >= b.threshold);
  const earnedIds = new Set(profile.badges);
  newBadges.forEach(b => earnedIds.add(b.id));
  profile.badges = Array.from(earnedIds);

  saveProfile(profile);
  return { profile, newBadges };
}

function renderResults(){
  const total = state.pool.length;
  const score = state.score;
  const pct = Math.round((score/total)*100);

  const { newBadges } = updateProfileAfterQuiz(total, score);

  track('quiz_completed', { run_length: total, score: score, percent: pct });
  newBadges.forEach(b => track('badge_unlocked', { badge_id: b.id, badge_name: b.name }));

  const unlockHtml = newBadges.length ? newBadges.map(b => {
    const reward = BADGE_REWARDS[b.id];
    return `
    <div class="unlockpanel">
      ${badgeHex(b, false)}
      <div class="utext">
        <div class="utitle">Badge unlocked</div>
        <div class="uname">${b.name} &middot; ${b.desc}</div>
      </div>
      ${reward ? `<a class="ucta" href="${reward.url}" target="_blank" rel="noopener" data-badge="${b.id}">${reward.text}</a>` : ''}
    </div>
  `;
  }).join('') : '';

  const byCat = {};
  state.log.forEach(entry=>{
    if(!byCat[entry.cat]) byCat[entry.cat] = {right:0, total:0};
    byCat[entry.cat].total++;
    if(entry.wasRight) byCat[entry.cat].right++;
  });

  const breakdownHtml = Object.keys(byCat).map(cat=>{
    const {right, total:t} = byCat[cat];
    const p = Math.round((right/t)*100);
    return `<div class="brow">
      <span class="blabel">${cat}</span>
      <span class="btrack"><span class="bfill" style="width:${p}%"></span></span>
      <span class="bval">${right}/${t}</span>
    </div>`;
  }).join('');

  // Weakest category -> tie it to the CTA so the pitch is specific, not generic.
  let weakest = null;
  Object.keys(byCat).forEach(cat=>{
    const {right, total:t} = byCat[cat];
    const acc = right / t;
    if(acc < 1 && (!weakest || acc < weakest.acc)){
      weakest = { cat, acc, right, total:t };
    }
  });

  const ctaHtml = weakest ? `
    <div class="ctacard">
      <div class="ceyebrow">Weak spot</div>
      <div class="ctitle">${weakest.cat} — ${weakest.right}/${weakest.total}</div>
      <div class="csub">${CONFIG.categoryLessonHints[weakest.cat] || 'The Full Bundle'} covers this in detail, with hands-on practice instead of multiple choice.</div>
      <a class="cbtn" id="weakCta" href="${CONFIG.bundleUrl}" target="_blank" rel="noopener">See the Full Bundle — $37</a>
    </div>
  ` : `
    <div class="ctacard">
      <div class="ceyebrow">Clean sweep</div>
      <div class="ctitle">Perfect score across every topic</div>
      <div class="csub">You're past the basics — the Full Bundle covers advanced ground like Docker and iptables this quiz doesn't touch.</div>
      <a class="cbtn" id="weakCta" href="${CONFIG.bundleUrl}" target="_blank" rel="noopener">See the Full Bundle — $37</a>
    </div>
  `;

  const missed = state.log.filter(e=>!e.wasRight);
  const missedHtml = missed.length ? `
    <div class="missed">
      <h3>Missed questions (${missed.length})</h3>
      ${missed.map(m=>`
        <div class="mitem">
          <div class="mq">${m.qtext}</div>
          <div class="ma">You answered ${m.chosen} — correct answer: <b>${m.correctText}</b></div>
        </div>
      `).join('')}
    </div>
  ` : `<div class="clean">No misses — clean run.</div>`;

  body.innerHTML = `
    ${unlockHtml}
    <div class="resulttop">
      <div class="ring" style="--pct:${pct}"><span class="val">${pct}%</span></div>
      <div class="rtext">
        <h2>${score} / ${total} correct</h2>
        <p>Across ${Object.keys(byCat).length} topic${Object.keys(byCat).length===1?'':'s'}</p>
      </div>
    </div>
    <div class="breakdown">${breakdownHtml}</div>
    ${ctaHtml}
    ${missedHtml}
    <div class="actions">
      <button class="abtn primary" id="retryBtn">Run again</button>
      <button class="abtn" id="homeBtn">Change length</button>
    </div>
  `;

  document.querySelectorAll('.ucta').forEach(el=>{
    el.addEventListener('click', ()=> track('quiz_cta_click', { type:'badge_reward', badge_id: el.dataset.badge }));
  });
  const weakCta = document.getElementById('weakCta');
  if(weakCta){
    weakCta.addEventListener('click', ()=> track('quiz_cta_click', {
      type: weakest ? 'weak_category' : 'clean_sweep',
      category: weakest ? weakest.cat : null
    }));
  }

  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(total));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

document.addEventListener('keydown', (e)=>{
  if(!state) return;
  if(['1','2','3','4'].includes(e.key)){
    const i = parseInt(e.key,10)-1;
    const opts = document.querySelectorAll('#options .opt');
    if(opts[i] && !state.answered) selectAnswer(i);
  }
  if(e.key === 'Enter' && state.answered){
    nextQuestion();
  }
});

renderStart();
</script>
</body>
</html>
